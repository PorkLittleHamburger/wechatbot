name: Bot checks

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements-runtime.lock
          .venv/Scripts/python.exe -m pip install -e '.[dev]'
      - name: Install vendored SDK
        shell: pwsh
        run: |
          $wheel = Get-ChildItem 'vendor/wechatbot_api' -Filter '*.whl' | Select-Object -First 1
          if (-not $wheel) { throw 'vendor/wechatbot_api is missing its wheel' }
          $expected = (Get-Content 'vendor/wechatbot_api/VENDORED.json' -Raw | ConvertFrom-Json).sha256
          $actual = (Get-FileHash $wheel.FullName -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "vendor wheel SHA-256 mismatch: $actual" }
          .venv/Scripts/python.exe -m pip install --no-index --no-deps $wheel.FullName
          .venv/Scripts/python.exe -c "import wechatbot_api; print(wechatbot_api.__version__)"
      - name: Verify Bot
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m compileall -q src
          .venv/Scripts/python.exe -m pytest -q
      - name: Verify native media paths
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD 'vendor/helper'
          .venv/Scripts/python.exe -m pytest -q vendor/helper/tests/test_native_profiles.py vendor/helper/tests/test_native_version_bridge.py vendor/helper/tests/test_account.py vendor/helper/tests/test_contacts.py vendor/helper/tests/test_group_members.py vendor/helper/tests/test_group_messaging.py vendor/helper/tests/test_image_native.py vendor/helper/tests/test_file_native.py vendor/helper/tests/test_files.py vendor/helper/tests/test_file_receiver.py vendor/helper/tests/test_file_integration.py vendor/helper/tests/test_voice_native.py vendor/helper/tests/test_quoted.py vendor/helper/tests/test_voice_receive_service.py vendor/helper/tests/test_long_text_send.py vendor/helper/tests/test_forwarded.py
      - name: Verify native path parsing
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/test_native_paths.ps1
      - name: Build portable package
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build_portable.ps1
