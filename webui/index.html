<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>WeChat OneBot · 控制台</title>
<script>if (localStorage.getItem('wechat-onebot-theme') === 'dark') document.documentElement.classList.add('dark');</script>
<style>
:root{
  --bg:#f7fafc; --rail:#edf4f8; --card:#ffffff; --card-2:#f5f9fb; --hover:#eaf4f9;
  --line:#dbe6ed; --line-soft:#e8eef2; --text:#183046; --text-2:#516b7d; --muted:#71899a;
  --accent:#168ec9; --accent-2:#087cb5; --accent-soft:#e3f3fc;
  --ok:#178a63; --warn:#b37616; --bad:#c64c57; --info:#168ec9;
  --field:#f9fcfd; --shade:#eff6fa; --accent-ink:#ffffff; --shadow:0 1px 2px rgba(20,48,70,.04),0 14px 30px -24px rgba(20,48,70,.35);
  --r:12px; --r-sm:8px;
  --font:"Inter","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,"Courier New",monospace;
}
html.dark{
  --bg:#151b24; --rail:#101720; --card:#1e2833; --card-2:#23303d; --hover:#2a3a48;
  --line:#334251; --line-soft:#2b3946; --text:#edf6fa; --text-2:#b0c3d0; --muted:#91a9b8;
  --accent:#72c8f2; --accent-2:#9ad9f6; --accent-soft:#1c4157;
  --ok:#6adeb2; --warn:#f3c369; --bad:#f28d99; --info:#72c8f2;
  --field:#18232d; --shade:#253440; --accent-ink:#102330; --shadow:0 1px 2px rgba(0,0,0,.28),0 16px 34px -24px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.55 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2d3238;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#3b414a;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.hidden{display:none!important}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- shell ---------- */
.app{display:flex;height:100vh;height:100dvh}
.rail{width:64px;flex:none;background:var(--rail);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;align-items:center;padding:12px 0 14px;gap:10px}
.rail-logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#ff8a5b,#f2622c);color:#1b1c1e;box-shadow:0 6px 16px rgba(255,122,69,.22);margin-bottom:6px}
.rail-logo svg{width:19px;height:19px;stroke-width:1.9}
.rail-nav,.rail-bottom{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.rail-bottom{margin-top:auto}
.rail-btn{position:relative;width:40px;height:40px;border:0;background:transparent;border-radius:10px;color:#7b828b;display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.rail-btn:hover{background:#23262a;color:#d4d8dd}
.rail-btn.active{background:var(--accent-soft);color:var(--accent)}
.rail-btn.active::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.rail-btn::after{content:attr(data-label);position:absolute;left:50px;top:50%;transform:translateY(-50%) scale(.96);white-space:nowrap;background:#2b2f34;border:1px solid #34383e;color:#e9ebee;font-size:12px;padding:5px 9px;border-radius:7px;opacity:0;pointer-events:none;transition:.12s;z-index:60}
.rail-btn:hover::after{opacity:1;transform:translateY(-50%) scale(1)}
.rail-sep{width:24px;height:1px;background:var(--line);margin:4px 0}
.workspace{flex:1;min-width:0;display:flex;flex-direction:column}
/* ---------- header ---------- */
.pagehead{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:26px 32px 18px;border-bottom:1px solid var(--line-soft)}
.eyebrow{font-size:11px;letter-spacing:.16em;color:#6e747c;font-weight:600;text-transform:uppercase}
.pagehead h1{margin:6px 0 2px;font-size:27px;line-height:1.2;font-weight:650;letter-spacing:-.01em}
.pagehead p{margin:0;color:var(--muted);font-size:12.5px}
.head-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.meta-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:#1b1e21;color:#9aa1aa;font-size:11.5px;font-family:var(--mono)}
.meta-chip b{color:#d6dae0;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:7px;height:27px;padding:0 11px;border-radius:7px;border:1px solid var(--line);background:#1b1e21;color:#a4abb4;font-size:12px;white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:#6b7280}
.pill.ok{color:#5ee09a;border-color:rgba(74,222,128,.28);background:rgba(74,222,128,.08)}
.pill.ok .dot{background:var(--ok);box-shadow:0 0 8px rgba(74,222,128,.7)}
.pill.bad{color:#fb8f8f;border-color:rgba(248,113,113,.28);background:rgba(248,113,113,.08)}
.pill.bad .dot{background:var(--bad)}
.account-chip{display:flex;align-items:center;gap:9px;height:38px;padding:0 12px 0 6px;border:1px solid var(--line);border-radius:10px;background:#1b1e21;cursor:pointer;transition:.15s}
.account-chip:hover{background:#21252a;border-color:#343940}
.avatar{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(150deg,#ff9a70,#ef5f2c);color:#211a16;font-weight:700;font-size:12px;flex:none}
.avatar.lg{width:54px;height:54px;border-radius:14px;font-size:22px}
.avatar.sm{width:22px;height:22px;border-radius:7px;font-size:10px}
.account-chip .ac-name{font-size:12.5px;font-weight:600;line-height:1.25;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-chip .ac-id{font-size:10.5px;color:var(--muted);font-family:var(--mono);line-height:1.2;max-width:150px;overflow:hidden;text-overflow:ellipsis}
/* ---------- pages ---------- */
.pages{flex:1;min-height:0;overflow:auto;padding:22px 32px 56px}
.view{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:14px}
.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
/* ---------- card ---------- */
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);min-width:0}
.card.accent{border-left:2px solid var(--accent)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.card-h h2{margin:0;font-size:13.5px;font-weight:600;letter-spacing:.01em}
.card-h .spacer{flex:1}
.card-h .hint{font-size:11.5px;color:var(--muted)}
.card-b{padding:16px 18px}
.card-b.tight{padding:8px 10px}
.metric{padding:15px 16px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.metric .m-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.metric .m-label{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.metric .m-icon{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#262a2f;color:#8e959e}
.metric .m-icon svg{width:14px;height:14px}
.metric .m-value{font-size:20px;font-weight:650;letter-spacing:-.01em;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.metric .m-sub{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.metric .m-value.ok{color:#6ee7a4}
.metric .m-value.bad{color:#fb8f8f}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.dim{color:var(--text-2)}
.small{font-size:11.5px}
.divider{height:1px;background:var(--line-soft);margin:12px 0}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:33px;padding:0 13px;border-radius:var(--r-sm);border:1px solid var(--line);background:#23262a;color:#dfe3e8;font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:#2a2e33;border-color:#363b42}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1d1512;font-weight:650}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;color:#9aa1aa}
.btn.ghost:hover{background:#262a2f;color:#e3e6ea}
.btn.danger{color:#fb8f8f}
.btn.danger:hover{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.btn.block{width:100%;height:38px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.busy{opacity:.75;cursor:progress}
.btn.busy::before{content:"";width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-btn{width:30px;height:30px;border:1px solid transparent;background:transparent;border-radius:7px;color:#8b929b;display:inline-grid;place-items:center;cursor:pointer;transition:.15s}
.icon-btn:hover{background:#262a2f;color:#e3e6ea}
.icon-btn svg{width:15px;height:15px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:11px;color:var(--muted);letter-spacing:.02em;display:flex;gap:5px;align-items:center}
.field>span .req{color:var(--accent)}
.input,select.input,textarea.input{width:100%;height:33px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:#15181b;color:var(--text);font-size:12.5px;outline:none;transition:.15s}
textarea.input{height:auto;padding:10px;font-family:var(--mono);font-size:12px;line-height:1.55;resize:vertical}
.input:focus{border-color:rgba(255,122,69,.55);box-shadow:0 0 0 3px rgba(255,122,69,.1)}
.input::placeholder{color:#5d646d}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7b828b 50%),linear-gradient(135deg,#7b828b 50%,transparent 50%);background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:26px}
.sort-control{position:relative;min-width:116px}
.sort-trigger{width:100%;justify-content:space-between}
.sort-trigger::after{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:10px;transition:transform .15s}
.sort-control.open .sort-trigger::after{transform:rotate(225deg) translateY(-2px)}
.sort-menu{position:absolute;z-index:30;top:calc(100% + 5px);left:0;min-width:100%;padding:4px;border:1px solid var(--line);border-radius:9px;background:var(--card);box-shadow:var(--shadow)}
.sort-option{display:block;width:100%;padding:7px 10px;border:0;border-radius:6px;background:transparent;color:var(--text);text-align:left;cursor:pointer;white-space:nowrap}
.sort-option:hover,.sort-option:focus-visible{background:var(--hover);outline:none}
.sort-option[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:650}
.process-card.bound{border-color:color-mix(in srgb,var(--accent) 42%,var(--line))}
.switch{width:38px;height:21px;border-radius:999px;background:#31353b;position:relative;cursor:pointer;border:0;flex:none;transition:background .18s}
.switch::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#c7ccd2;transition:transform .18s,background .18s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(17px);background:#fff}
.check{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);cursor:pointer;user-select:none}
.check input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.search{position:relative;flex:1;min-width:160px;max-width:320px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:#6d747d;stroke-width:1.8}
.search .input{padding-left:29px;height:31px}
.form-error{min-height:16px;margin:8px 0 0;font-size:12px;color:#fb8f8f}
/* ---------- badges / chips ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;background:#272b30;color:#9aa1aa;font-size:10.5px;font-family:var(--mono);letter-spacing:.02em;white-space:nowrap}
.badge.ok{background:rgba(74,222,128,.1);color:#68e3a2}
.badge.warn{background:rgba(251,191,36,.1);color:#f4c85c}
.badge.bad{background:rgba(248,113,113,.1);color:#fb9b9b}
.badge.info{background:rgba(122,162,255,.12);color:#9bb8ff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--line);background:#1a1d20;color:#aab1ba;font-size:11px;font-family:var(--mono)}
.dot{width:6px;height:6px;border-radius:50%;background:#6b7280;flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 7px rgba(74,222,128,.55)}
.dot.bad{background:var(--bad)}
.dot.warn{background:var(--warn)}
.dot.idle{background:#565d66}
/* ---------- list rows ---------- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line-soft);min-width:0}
.row:last-child{border-bottom:0}
.row:hover{background:#212429}
.row .r-main{flex:1;min-width:0}
.row .r-title{font-size:12.5px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r-sub{font-size:11px;color:var(--muted);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r-right{display:flex;align-items:center;gap:8px;flex:none;font-size:11.5px;color:var(--muted)}
.empty{padding:34px 18px;text-align:center;color:#666d76;font-size:12.5px}
.empty .e-icon{width:38px;height:38px;margin:0 auto 10px;border-radius:11px;background:#24282d;display:grid;place-items:center;color:#6d747d}
.empty .e-icon svg{width:18px;height:18px}
/* ---------- code ---------- */
pre.code{margin:0;padding:14px 16px;background:#15181b;border:1px solid var(--line-soft);border-radius:10px;font-family:var(--mono);font-size:11.5px;line-height:1.65;color:#c8d0d9;overflow:auto;max-height:520px;white-space:pre;tab-size:2}
pre.code .k{color:#ffb08c}
pre.code .s{color:#9ad5a3}
pre.code .n{color:#9bb8ff}
pre.code .b{color:#d7a5ff}
/* ---------- toasts ---------- */
.toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:9px;z-index:200;max-width:360px}
.toast{display:flex;gap:9px;align-items:flex-start;padding:11px 14px;border-radius:10px;background:#23272c;border:1px solid #343940;border-left:2px solid var(--accent);box-shadow:0 14px 34px rgba(0,0,0,.42);font-size:12.5px;animation:tin .18s ease-out}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}
.toast svg{width:15px;height:15px;margin-top:1px;color:var(--accent)}
.toast.ok svg{color:var(--ok)}.toast.bad svg{color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ---------- login ---------- */
.login{height:100vh;height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 16% 10%,rgba(255,122,69,.14),transparent 46%),radial-gradient(circle at 84% 90%,rgba(122,162,255,.07),transparent 44%),#101214}
.login-card{width:min(392px,100%);background:#1b1e21;border:1px solid var(--line);border-radius:16px;padding:30px 28px 22px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.brand-lg{width:46px;height:46px;border-radius:13px;background:linear-gradient(145deg,#ff8a5b,#f2622c);display:grid;place-items:center;color:#1d1512;margin-bottom:16px;box-shadow:0 10px 26px rgba(255,122,69,.25)}
.brand-lg svg{width:23px;height:23px;stroke-width:1.9}
.login-card h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.01em}
.lg-sub{margin:4px 0 20px;color:var(--muted);font-size:12.5px}
.lg-badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:#8f969f;border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-family:var(--mono);margin-bottom:14px}
.login-card .field{margin-bottom:12px}
.login-foot{display:flex;gap:7px;align-items:flex-start;margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:11px;color:#6f767f;line-height:1.6}
.login-foot svg{width:13px;height:13px;margin-top:2px}
/* ---------- misc ---------- */
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.kv .k{font-size:10.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:2px}
.kv .v{font-size:12.5px;font-family:var(--mono);word-break:break-all}
.note{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);color:#e0c47c;font-size:11.5px;line-height:1.6}
.note svg{width:14px;height:14px;margin-top:1px;flex:none}
.section{display:flex;flex-direction:column;gap:10px}
.section-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:2px 2px 0}
.section-h h2{margin:0;font-size:13.5px;font-weight:600}
.section-h p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.acct{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.acct .ac-meta{min-width:0;flex:1}
.acct .ac-meta h2{margin:0;font-size:17px;font-weight:650}
.acct .ac-meta p{margin:3px 0 0;font-size:11.5px;color:var(--muted);font-family:var(--mono);word-break:break-all}
.scroll{max-height:352px;overflow:auto}
.scroll.tall{max-height:calc(100vh - 320px)}
/* ---------- endpoints ---------- */
.endpoint .ep-h{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.endpoint .ghost-input{flex:1;min-width:0;border:0;background:transparent;font-size:12.5px;font-weight:600;color:#e3e6ea;outline:none;padding:2px 4px;border-radius:5px}
.endpoint .ghost-input:focus{background:#15181b;box-shadow:0 0 0 1px var(--line)}
.endpoint .ep-b{padding:12px 14px;display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.endpoint .ep-b .span2{grid-column:span 2}
.endpoint .ep-f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 14px;border-top:1px solid var(--line-soft);font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.endpoint.off{opacity:.6}
/* ---------- events / debug split ---------- */
.split{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.9fr);gap:14px;align-items:start}
.debug{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:start}
.event-list{max-height:calc(100vh - 310px);overflow:auto;min-height:220px}
.event-row{display:grid;grid-template-columns:60px 76px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:12px}
.event-row:last-child{border-bottom:0}
.event-row:hover{background:#212429}
.event-row.sel{background:rgba(255,122,69,.07)}
.event-time{font-family:var(--mono);font-size:10.5px;color:#6e757e}
.event-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d2d7dd}
.event-meta{font-size:10px;color:#6e757e;font-family:var(--mono);text-align:right}
.act-list{max-height:calc(100vh - 268px);overflow:auto;padding:6px}
.act-group{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#666d76;padding:11px 10px 5px}
.act-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;border:1px solid transparent;min-width:0}

/* SnowLuma-style protocol console: light canvas, blue controls, expandable rail. */
html{color-scheme:light}
html.dark{color-scheme:dark}
body{background:var(--bg);color:var(--text)}
::-webkit-scrollbar-thumb{background:var(--line);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
.rail{width:64px;align-items:stretch;padding:10px 0 14px;gap:8px;transition:width .2s ease;overflow:hidden;z-index:30;border-color:var(--line)}
.rail:hover,.rail.pinned{width:230px}
.rail-brand{display:flex;align-items:center;gap:11px;white-space:nowrap;padding:2px 12px 12px;border-bottom:1px solid var(--line-soft);height:58px}
.rail-logo,.brand-lg{background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);box-shadow:none}
.rail-logo{margin:0;flex:none}
.rail-brand-copy{opacity:0;min-width:140px;transition:opacity .16s}
.rail:hover .rail-brand-copy,.rail.pinned .rail-brand-copy{opacity:1}
.rail-brand-copy strong{display:block;font-size:13px;line-height:1.3}
.rail-brand-copy small{display:block;color:var(--muted);font-size:10px;white-space:nowrap}
.rail-nav,.rail-bottom{align-items:stretch;gap:4px;padding:0 8px}
.rail-btn{width:100%;height:46px;display:flex;justify-content:flex-start;gap:12px;padding:0 13px;color:var(--muted);white-space:nowrap}
.rail-btn svg{width:17px;height:17px}
.rail-btn:hover{background:var(--hover);color:var(--text)}
.rail-btn.active{background:var(--accent-soft);color:var(--accent)}
.rail-btn.active::before{left:-8px;top:11px;bottom:11px;width:3px}
.rail-btn span{opacity:0;transition:opacity .16s;display:flex;flex-direction:column;text-align:left;line-height:1.25}
.rail-btn span strong{font-size:12px;font-weight:650}
.rail-btn span small{font-size:10px;color:var(--muted)}
.rail:hover .rail-btn span,.rail.pinned .rail-btn span{opacity:1}
.rail-btn::after{left:53px;background:var(--card);border-color:var(--line);color:var(--text);box-shadow:var(--shadow)}
.rail:hover .rail-btn::after,.rail.pinned .rail-btn::after{display:none}
.rail-sep{margin:4px 12px}
.rail-pin{display:none;margin:3px 10px 0;padding:5px;border:0;background:none;color:var(--muted);cursor:pointer;text-align:left}
.rail:hover .rail-pin,.rail.pinned .rail-pin{display:block}
.pagehead{border-color:var(--line-soft);background:var(--card);padding:21px 30px 17px}
.eyebrow{color:var(--accent)}
.pages{padding:24px 30px 55px}
.card,.login-card{box-shadow:var(--shadow);border-color:var(--line)}
.card-h,.row,.resp-h,.tab-row{border-color:var(--line-soft)}
.metric .m-icon,.empty .e-icon{background:var(--shade);color:var(--accent)}
.metric .m-value.ok,.pill.ok{color:var(--ok)}
.metric .m-value.bad,.pill.bad{color:var(--bad)}
.meta-chip,.pill,.account-chip,.badge,.chip,.btn,.toast{background:var(--card-2);border-color:var(--line);color:var(--text-2)}
.account-chip:hover{background:var(--hover);border-color:var(--line)}
.pill .dot,.dot.idle{background:var(--muted);box-shadow:none}
.meta-chip b{color:var(--text)}
.pill.ok,.badge.ok{background:color-mix(in srgb,var(--ok) 11%,var(--card));border-color:color-mix(in srgb,var(--ok) 30%,var(--line));color:var(--ok)}
.pill.bad,.badge.bad{background:color-mix(in srgb,var(--bad) 9%,var(--card));border-color:color-mix(in srgb,var(--bad) 25%,var(--line));color:var(--bad)}
.badge.warn{background:color-mix(in srgb,var(--warn) 10%,var(--card));color:var(--warn)}
.badge.bad{background:color-mix(in srgb,var(--bad) 9%,var(--card));color:var(--bad)}
.badge.info{background:var(--accent-soft);color:var(--accent)}
.avatar{background:var(--accent-soft);color:var(--accent);border:1px solid var(--line)}
.btn{color:var(--text)}
.btn:hover,.icon-btn:hover,.row:hover,.event-row:hover,.act-item:hover{background:var(--hover);border-color:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.check{color:var(--text-2)}
.search svg{color:var(--muted)}
.form-error{color:var(--bad)}
.chip{background:var(--field);color:var(--text-2)}

pre.code{background:var(--field);color:var(--text);border-color:var(--line)}

.toast{background:var(--card);box-shadow:var(--shadow)}
.login{background:radial-gradient(circle at 18% 8%,var(--accent-soft),transparent 42%),var(--bg)}
.login-card{background:var(--card)}
.lg-badge,.login-foot{color:var(--muted);border-color:var(--line-soft)}

.event-row.sel,.act-item.sel{background:var(--accent-soft);border-color:var(--line)}
.event-title,.act-item .a-name,.act-item.sel .a-name{color:var(--text)}

.page-tabs{display:flex;gap:4px;padding:5px;background:var(--card-2);border:1px solid var(--line);border-radius:12px;overflow-x:auto}

.surface-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.process-card{display:flex;flex-direction:column;gap:14px;padding:17px}

.log-line:hover{background:var(--hover)}

.log-line.warn .level{color:var(--warn)}
.log-line.error .level{color:var(--bad)}
.log-line .message{white-space:pre-wrap;word-break:break-word}
.settings-layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;align-items:start}
.settings-nav{display:flex;flex-direction:column;gap:5px;padding:8px}
.settings-nav button{border:0;background:none;color:var(--text-2);padding:9px 11px;border-radius:8px;text-align:left;cursor:pointer}
.settings-nav button:hover{background:var(--hover)}
.settings-nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:650}
@media(max-width:760px){
  .rail,.rail:hover,.rail.pinned{width:54px}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function initial(name) { return (String(name || "W").trim().slice(0, 1) || "W").toUpperCase(); }
function fmtBytes(n) {
  const v = Number(n) || 0; if (!v) return "0 B";
  const units = ["B", "KB", "MB", "GB"]; let i = 0; let x = v;
  while (x >= 1024 && i < units.length - 1) { x /= 1024; i += 1; }
  return (i > 0 && x < 10 ? x.toFixed(1) : Math.round(x)) + " " + units[i];
}
function fmtTime(ts) {
  if (!ts) return "—";
  const d = typeof ts === "number" ? new Date(ts > 1e12 ? ts : ts * 1000) : new Date(ts);
  return d.toLocaleTimeString("zh-CN", { hour12: false });
}
function fmtDateTime(ts) {
  if (!ts) return "—";
  const d = typeof ts === "number" ? new Date(ts > 1e12 ? ts : ts * 1000) : new Date(ts);
  return d.toLocaleString("zh-CN", { hour12: false });
}
function toast(message, kind = "info", ms = 3600) {
  const box = document.createElement("div");
  box.className = "toast " + (kind === "ok" ? "ok" : kind === "bad" ? "bad" : "");
  const icon = kind === "ok" ? "i-check" : kind === "bad" ? "i-alert" : "i-msg";
  box.innerHTML = "<svg class=\"i\"><use href=\"#" + icon + "\"/></svg><div>" + esc(message) + "</div>";
  $("#toasts").appendChild(box);
  setTimeout(() => box.remove(), ms);
}
function busyButton(button, label) {
  const previous = button.innerHTML;
  button.disabled = true;
  button.classList.add("busy");
  button.textContent = label;
  return () => { if (button.isConnected) { button.innerHTML = previous; button.classList.remove("busy"); button.disabled = false; } };
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("已复制到剪贴板", "ok", 1800); }
  catch (e) { toast("复制失败，请手动选择文本", "bad"); }
}

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: "same-origin", cache: "no-store", ...opts });
  const ct = res.headers.get("content-type") || "";
  const body = ct.includes("application/json") ? await res.json() : await res.text();
  if (!res.ok) {
    const err = new Error(typeof body === "string" ? body : (body.message || body.detail || ("HTTP " + res.status)));
    err.status = res.status;
    throw err;
  }
  return body;
}

async function callAction(action, params = {}) {
  if (!S.account) throw new Error("账号尚未就绪");
  const started = performance.now();
  const body = await api("/api/accounts/" + encodeURIComponent(S.account) + "/action", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, params: params || {}, echo: Date.now() })
  });
  body._elapsed = Math.round(performance.now() - started);
  return body;
}

async function showLogin() {
  if (S.es) { S.es.close(); S.es = null; }
  $("#app").classList.add("hidden");
  $("#setup").classList.add("hidden");
  $("#login").classList.remove("hidden");
  try {
    S.setupRequired = (await api("/api/auth-state")).setupRequired;
    $("#credentialLabel").textContent = S.setupRequired ? "首次登录 Token" : "管理密码";
    $("#credential").placeholder = S.setupRequired ? "启动窗口中的 WebUI Token" : "请输入管理密码";
    $("#loginHint").textContent = S.setupRequired
      ? "首次验证后请设置管理密码。OneBot 凭据与管理页分离。"
      : "使用首次设置的密码登录。OneBot 凭据与管理页分离。";
  } catch (error) { $("#loginErr").textContent = "无法读取登录状态：" + error.message; }
  $("#credential").focus();
}
function showSetup() {
  $("#login").classList.add("hidden");
  $("#app").classList.add("hidden");
  $("#setup").classList.remove("hidden");
  $("#newPassword").focus();
}
function enterApp() {
  $("#login").classList.add("hidden");
  $("#setup").classList.add("hidden");

  connectStream();
}

$("#loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const credential = $("#credential").value;
  $("#loginErr").textContent = "";
  if (!credential) { $("#loginErr").textContent = S.setupRequired ? "请输入首次登录 Token" : "请输入管理密码"; return; }
  $("#btnLogin").disabled = true;
  try {
    const payload = S.setupRequired ? { token: credential.trim() } : { password: credential };
    const result = await api("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    $("#credential").value = "";
    if (result.setupRequired) showSetup(); else await boot();
  } catch (error) {
    $("#loginErr").textContent = error.message || "登录失败";
  } finally {
    $("#btnLogin").disabled = false;
  }
});

$("#setupForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const password = $("#newPassword").value;
  $("#setupErr").textContent = "";
  if (password.length < 8) { $("#setupErr").textContent = "密码至少需要 8 个字符"; return; }
  if (password !== $("#confirmPassword").value) { $("#setupErr").textContent = "两次输入的密码不一致"; return; }
  $("#btnSetup").disabled = true;
  try {
    await api("/api/setup-password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password }) });
    $("#newPassword").value = ""; $("#confirmPassword").value = "";
    S.setupRequired = false;
    await boot();
  } catch (error) { $("#setupErr").textContent = error.message || "保存密码失败"; }
  finally { $("#btnSetup").disabled = false; }
});

$("#btnLogout").addEventListener("click", async () => {
  try { await api("/api/logout", { method: "POST" }); }
  catch (error) { toast("退出登录失败：" + error.message, "bad"); return; }

});

/* ---------- status ---------- */
function applyStatus(payload) {
  const previousAccount = S.account;
  const previousNickname = S.status && S.status.configuredNickname;
  const previousProcessState = S.status && JSON.stringify([S.status.configuredAccount, (S.status.runtimes || []).map((r) => [r.account, r.pid, r.started, r.online])]);
  S.status = payload;
  const runtimes = payload.runtimes || [];
  S.runtime = S.selectedAccount
    ? (runtimes.find((r) => r.account === S.selectedAccount) || null)
    : (runtimes.find((r) => r.account === payload.configuredAccount) || runtimes[0] || null);
  S.account = S.selectedAccount || (S.runtime ? S.runtime.account : (payload.configuredAccount || null));
  if (S.account !== previousAccount) {
    S.loginInfo = null; S.versionInfo = null; S.friends = null; S.groups = null;
    S.network = null; S.storage = null; S.caps = null; S.catalog = null;
  }
  updateChrome();
  if (payload.lastError && payload.lastError !== S.lastErrorShown) {
    S.lastErrorShown = payload.lastError;
    toast(payload.lastError, "bad", 6000);
  }
  if (S.view === "overview") syncOverview();
  if (S.view === "account") {
    if (S.account !== previousAccount || payload.configuredNickname !== previousNickname) render();
    else syncAccount();
  }
  const processState = JSON.stringify([payload.configuredAccount, runtimes.map((r) => [r.account, r.pid, r.started, r.online])]);
  if (S.view === "account" && previousProcessState !== processState && !S.processLoading) loadProcesses(false);
  if (S.view === "connect") syncConnectStates();
}

function selectAccount(account, force = false) {
  if (!account || (account === S.account && !force)) return;
  S.selectedAccount = account;
  S.loginInfo = null; S.versionInfo = null; S.caps = null; S.catalog = null; S.catalogError = "";
  S.friends = null; S.groups = null; S.network = null; S.storage = null;
  S.events = []; S.selectedEvent = null;
  applyStatus(S.status);
  render();
}

function updateChrome() {
  const rt = S.runtime;
  const online = !!(rt && rt.online);
  const started = !!(rt && rt.started);
  const pill = $("#hdrStatus");
  pill.className = "pill" + (online ? " ok" : (started ? " bad" : ""));
  $("#hdrStatusText").textContent = online ? "在线" : (started ? "离线" : "未启动");
  $("#hdrSelf").textContent = rt && rt.self_id ? rt.self_id : "—";
  $("#hdrPid").textContent = rt && rt.pid ? rt.pid : "—";
  const nickname = (S.loginInfo && S.loginInfo.nickname && S.loginInfo.nickname.trim()) ||
    (S.status && S.account === S.status.configuredAccount && S.status.configuredNickname) || (S.account || "未绑定");
  $("#hdrNick").textContent = nickname;
  $("#hdrWxid").textContent = S.account || "—";
  $("#hdrAvatar").textContent = initial(nickname);
}

async function refreshStatus() {
  try { applyStatus(await api("/api/status")); }
  catch (error) { if (error.status === 401) showLogin(); else toast(error.message, "bad"); }
}

function connectStream() {
  if (S.es) S.es.close();
  S.es = new EventSource("/api/events");
  S.es.onmessage = (event) => {
    try { applyStatus(JSON.parse(event.data)); } catch (e) {}
  };
  S.es.onerror = () => {};
}

async function loadCaps(force = false) {
  if (!S.account) return;
  if (S.caps && !force) return;
  if (S.catalogLoading || (S.catalogError && !force)) return;
  const account = S.account;
  S.catalogLoading = true;
  try {
    const body = await callAction("get_capabilities");
    if (S.account !== account) return;
    if (body && body.status === "ok") {
      S.caps = body.data || null;
      S.catalog = (body.data && body.data.action_catalog) || null;
      if (!S.catalog) S.catalogError = "运行时未提供动作目录";
      if (S.view === "overview") fillOverviewCaps();
    } else S.catalogError = "账号 Runtime 未就绪，启动后可读取动作目录";
  } catch (error) {
    if (S.account === account) S.catalogError = error.message;
  } finally {
    S.catalogLoading = false;
    if (S.account === account && S.view === "debug") render();
  }
}
async function loadLoginInfo() {
  if (!S.account) return;
  const account = S.account;
  try {
    const body = await callAction("get_login_info");
    if (S.account === account && body && body.status === "ok") { S.loginInfo = body.data || null; updateChrome(); if (S.view === "account") render(); }
  } catch (error) {}
}

async function loadOverviewEvents() {
  if (!S.account) { const el = $("#ovEvents"); if (el) el.innerHTML = emptyState("账号未就绪"); return; }
  try {
    const body = await api("/api/accounts/" + encodeURIComponent(S.account) + "/events");
    const rows = (body.events || []).slice(-7).reverse();
    const el = $("#ovEvents"); if (!el) return;
    el.innerHTML = rows.length ? rows.map((ev) => {
      const kind = ev.post_type || "event";
      const detail = ev.post_type === "message" ? ((ev.sender && ev.sender.nickname) || "") + " · " + (ev.message_type || "") : (ev.sub_type || ev.notice_type || ev.request_type || "");
      return "<div class=\"row\"><span class=\"badge " + badgeClass(kind) + "\">" + esc(kind) + "</span>" +
        "<div class=\"r-main\"><div class=\"r-title\">" + esc(summarize(ev)) + "</div><div class=\"r-sub\">" + esc(detail) + "</div></div>" +
        "<div class=\"r-right mono\">" + esc(fmtTime(ev.time)) + "</div></div>";
    }).join("") : emptyState("暂无事件");
  } catch (error) {
    const el = $("#ovEvents"); if (el) el.innerHTML = emptyState(error.message || "读取失败");
  }
}

function badgeClass(kind) {
  return kind === "message" ? "info" : kind === "meta_event" ? "" : kind === "notice" ? "warn" : kind === "request" ? "ok" : "";
}
function summarize(ev) {
  if (!ev || typeof ev !== "object") return "—";
  if (ev.post_type === "message") {
    const raw = ev.raw_message || (typeof ev.message === "string" ? ev.message : (Array.isArray(ev.message) ? ev.message.map((s) => s.type === "text" ? (s.data && s.data.text) || "" : "[" + s.type + "]").join("") : ""));
    return raw || "[消息]";
  }
  if (ev.post_type === "meta_event") return "meta_event · " + (ev.meta_event_type || "heartbeat");
  if (ev.post_type === "notice") return (ev.notice_type || "notice") + (ev.sub_type ? " · " + ev.sub_type : "");
  if (ev.post_type === "request") return (ev.request_type || "request");
  return ev.post_type || "event";
}

    "<div id=\"procBody\" class=\"grid cols-2\"></div>");
  drawProcesses();
  if (!S.processes && !S.processLoading) loadProcesses(false);
}

async function loadProcesses(scan) {
  const request = ++S.processRequest;
  S.processLoading = true;
  try {
    const result = await api("/api/processes" + (scan ? "?scan=true" : ""));
    if (request !== S.processRequest) return false;
    S.processes = result.processes;
    S.processError = result.error || "";
    return !S.processError;
  } catch (error) {
    if (request !== S.processRequest) return false;
    S.processError = error.message;
    return false;
  } finally {
    if (request === S.processRequest) {
      S.processLoading = false;
      if (S.view === "account") drawProcesses();
    }
  }
}

function drawProcesses() {
  const box = $("#procBody"); if (!box) return;
  const rows = [...(S.processes || [])];
  if (S.processSort === "pid") rows.sort((a, b) => (a.pid || 0) - (b.pid || 0));
  else if (S.processSort === "name") rows.sort((a, b) => String(a.account || "").localeCompare(String(b.account || "")));
  else rows.sort((a, b) => Number(!!b.configured) - Number(!!a.configured) || Number(!!b.online) - Number(!!a.online) || Number(!!b.running) - Number(!!a.running));
  const warning = S.processError ? "<div class=\"note\" style=\"grid-column:1/-1\">" + esc(S.processError) + "</div>" : "";
  box.innerHTML = warning + (rows.length ? rows.map((row) =>
    "<div class=\"card process-card" + (row.configured ? " bound" : "") + "\"><div class=\"process-top\"><div class=\"avatar lg\">" + esc(initial(row.nickname || row.account)) + "</div>" +
    "<div style=\"flex:1;min-width:0\"><strong>" + esc(row.nickname || row.account || "未知账号") + "</strong><div class=\"small muted mono\">" + esc(row.account || "未识别") + "</div></div>" +
    "<span class=\"badge " + (row.online ? "ok" : row.running ? "warn" : "") + "\">" + (row.online ? "在线" : row.running ? "已启动" : "未启动") + "</span></div>" +
    "<div class=\"kv\"><div><div class=\"k\">PID</div><div class=\"v\">" + esc(row.pid || "—") + "</div></div><div><div class=\"k\">来源</div><div class=\"v\">" + (row.configured ? "已配置" : "已发现") + "</div></div></div>" +
    "<div class=\"process-actions\"><button class=\"btn sm\" data-act=\"proc-select\" data-account=\"" + esc(row.account || "") + "\">查看账号</button>" +
    (!row.configured ? "<button class=\"btn primary sm\" data-act=\"proc-bind\" data-account=\"" + esc(row.account || "") + "\">设为机器人账号</button>" : "<span class=\"badge ok\">当前绑定</span>") +
    (row.running ? "<span class=\"small muted\">Runtime 已接入</span>" : "<span class=\"small muted\">等待 Runtime 接入</span>") + "</div></div>").join("") : emptyState(S.processes ? "未发现微信账号" : "正在读取实例状态…", "i-cpu"));
}

/* ---------- account ---------- */
function renderAccount(root) {
  const rt = S.runtime;
  const nick = (S.loginInfo && S.loginInfo.nickname && S.loginInfo.nickname.trim()) ||
    (S.status && S.account === S.status.configuredAccount && S.status.configuredNickname) || (S.account || "未绑定");
  const wxid = S.account || "—";
  const online = !!(rt && rt.online);
  root.innerHTML =
    "<div class=\"card accent\"><div class=\"card-b\"><div class=\"acct\">" +
      "<div class=\"avatar lg\">" + esc(initial(nick)) + "</div>" +
      "<div class=\"ac-meta\"><h2>" + esc(nick) + "</h2><p>" + esc(wxid) + "</p>" +
        "<div class=\"toolbar\" style=\"margin-top:9px\"><span class=\"pill " + (online ? "ok" : "bad") + "\"><i class=\"dot\"></i>" + (online ? "在线" : (rt && rt.started ? "离线" : "未启动")) + "</span>" +
        "<span class=\"badge\">driver " + esc((S.status && S.status.driver) || "—") + "</span>" +
        "<span class=\"badge\">self_id " + esc((rt && rt.self_id) || "—") + "</span>" +
        "<span class=\"badge\" id=\"acPid\">PID " + esc((rt && rt.pid) || (S.status && S.account === S.status.configuredAccount && S.status.configuredPid) || "—") + "</span></div></div>" +
      "<div class=\"toolbar\"><button class=\"btn primary\" data-act=\"acct-start\"" + (!S.account || (rt && rt.started) || S.bridgeBusy ? " disabled" : "") + "><svg class=\"i\"><use href=\"#i-play\"/></svg>启动微信桥接</button>" +
        "<button class=\"btn\" data-act=\"acct-restart\"" + (!(rt && rt.started) || S.bridgeBusy ? " disabled" : "") + "><svg class=\"i\"><use href=\"#i-refresh\"/></svg>重启微信桥接</button>" +
        "<button class=\"btn danger\" data-act=\"acct-stop\"" + (!(rt && rt.started) || S.bridgeBusy ? " disabled" : "") + "><svg class=\"i\"><use href=\"#i-stop\"/></svg>停止微信桥接</button></div>" +
    "</div></div></div>" +
    "<div class=\"grid metrics\">" +
      "<div class=\"card metric\"><div class=\"m-top\"><span class=\"m-label\">协议端版本</span><span class=\"m-icon\"><svg class=\"i\"><use href=\"#i-cpu\"/></svg></span></div><div class=\"m-value mono\" id=\"acVer\">" + esc((S.versionInfo && S.versionInfo.app_version) || "—") + "</div><div class=\"m-sub\">app version</div></div>" +
      "<div class=\"card metric\"><div class=\"m-top\"><span class=\"m-label\">消息存储</span><span class=\"m-icon\"><svg class=\"i\"><use href=\"#i-db\"/></svg></span></div><div class=\"m-value\" id=\"acMsg\">" + esc(rt ? rt.message_count : 0) + "</div><div class=\"m-sub\">条持久化消息</div></div>" +
      "<div class=\"card metric\"><div class=\"m-top\"><span class=\"m-label\">好友</span><span class=\"m-icon\"><svg class=\"i\"><use href=\"#i-user\"/></svg></span></div><div class=\"m-value\" id=\"acFriends\">" + (S.friends ? S.friends.length : "—") + "</div><div class=\"m-sub\">get_friend_list</div></div>" +
      "<div class=\"card metric\"><div class=\"m-top\"><span class=\"m-label\">群聊</span><span class=\"m-icon\"><svg class=\"i\"><use href=\"#i-msg\"/></svg></span></div><div class=\"m-value\" id=\"acGroups\">" + (S.groups ? S.groups.length : "—") + "</div><div class=\"m-sub\">get_group_list</div></div>" +
    "</div>" +
    "<div class=\"grid cols-2\">" +
      "<div class=\"card\"><div class=\"card-h\"><h2>好友</h2><div class=\"spacer\"></div><span class=\"hint\" id=\"acFriendHint\">" + (S.friends ? S.friends.length + " 位" : "—") + "</span>" +
        "<button class=\"btn ghost sm\" data-act=\"acct-friends\"><svg class=\"i\"><use href=\"#i-refresh\"/></svg>读取</button></div>" +
        "<div class=\"card-b\" style=\"padding-bottom:8px\"><div class=\"search\"><svg class=\"i\"><use href=\"#i-search\"/></svg>" +
        "<input class=\"input\" id=\"friendSearch\" placeholder=\"搜索昵称 / 备注 / user_id\"></div></div>" +
        "<div class=\"rows scroll\" id=\"friendList\">" + emptyState("点击“读取”获取好友列表", "i-user") + "</div></div>" +
      "<div class=\"card\"><div class=\"card-h\"><h2>群聊</h2><div class=\"spacer\"></div><span class=\"hint\" id=\"acGroupHint\">" + (S.groups ? S.groups.length + " 个" : "—") + "</span>" +
        "<button class=\"btn ghost sm\" data-act=\"acct-groups\"><svg class=\"i\"><use href=\"#i-refresh\"/></svg>读取</button></div>" +
        "<div class=\"card-b\" style=\"padding-bottom:8px\"><div class=\"search\"><svg class=\"i\"><use href=\"#i-search\"/></svg>" +
        "<input class=\"input\" id=\"groupSearch\" placeholder=\"搜索群名 / group_id\"></div></div>" +
        "<div class=\"rows scroll\" id=\"groupList\">" + emptyState("点击“读取”获取群列表", "i-msg") + "</div></div>" +
    "</div>";
  const fs = $("#friendSearch");
  if (fs) fs.addEventListener("input", () => { S.friendQuery = fs.value; renderFriendList(); });
  const gs = $("#groupSearch");
  if (gs) gs.addEventListener("input", () => { S.groupQuery = gs.value; renderGroupList(); });
  if (S.friends) renderFriendList(); else maybeLoadFriends();
  if (S.groups) renderGroupList(); else maybeLoadGroups();
  if (!S.loginInfo) loadLoginInfo();
  loadVersionInfo();
}

function syncAccount() {
  const rt = S.runtime; const pill = document.querySelector("#view .acct .pill");
  if (pill) {
    pill.className = "pill " + (rt && rt.online ? "ok" : rt && rt.started ? "bad" : "");
    pill.innerHTML = "<i class=\"dot\"></i>" + (rt && rt.online ? "在线" : (rt && rt.started ? "离线" : "未启动"));
  }
  const m = $("#acMsg"); if (m && rt) m.textContent = String(rt.message_count ?? 0);
  const pid = $("#acPid"); if (pid) pid.textContent = "PID " + ((rt && rt.pid) || (S.status && S.account === S.status.configuredAccount && S.status.configuredPid) || "—");
  for (const action of ["start", "restart", "stop"]) {
    const button = $("[data-act='acct-" + action + "']");
    if (button && !button.classList.contains("busy")) button.disabled = S.bridgeBusy ||
      (action === "start" ? !S.account || !!(rt && rt.started) : !(rt && rt.started));
  }
}

async function maybeLoadFriends() {
  if (!S.account || S.friends) return;
  try { await loadFriends(); } catch (e) {}
}
async function maybeLoadGroups() {
  if (!S.account || S.groups) return;
  try { await loadGroups(); } catch (e) {}
}
async function loadFriends() {
  const account = S.account;
  const body = await callAction("get_friend_list");
  if (body.status !== "ok") throw new Error(body.message || ("retcode " + body.retcode));
  if (S.account !== account) return;
  S.friends = body.data || [];
  const hint = $("#acFriendHint"); if (hint) hint.textContent = S.friends.length + " 位";
  const metric = $("#acFriends"); if (metric) metric.textContent = String(S.friends.length);
  renderFriendList();
}
async function loadGroups() {
  const account = S.account;
  const body = await callAction("get_group_list");
  if (body.status !== "ok") throw new Error(body.message || ("retcode " + body.retcode));
  if (S.account !== account) return;
  S.groups = body.data || [];
  const hint = $("#acGroupHint"); if (hint) hint.textContent = S.groups.length + " 个";
  const metric = $("#acGroups"); if (metric) metric.textContent = String(S.groups.length);
  renderGroupList();
}
function renderFriendList() {
  const box = $("#friendList"); if (!box) return;
  const q = S.friendQuery.trim().toLowerCase();
  const rows = (S.friends || []).filter((f) => !q || String(f.nickname || "").toLowerCase().includes(q) || String(f.remark || "").toLowerCase().includes(q) || String(f.user_id).includes(q));
  box.innerHTML = rows.length ? rows.map((f) =>
    "<div class=\"row\"><div class=\"avatar sm\">" + esc(initial(f.nickname || f.remark)) + "</div>" +
    "<div class=\"r-main\"><div class=\"r-title\">" + esc(f.remark || f.nickname || "未命名") + "</div>" +
    "<div class=\"r-sub\">" + esc(f.nickname || "") + "</div></div>" +
    "<div class=\"r-right mono\">" + esc(f.user_id) + "</div></div>").join("") : emptyState(q ? "没有匹配的好友" : "好友列表为空", "i-user");
}
function renderGroupList() {
  const box = $("#groupList"); if (!box) return;
  const q = S.groupQuery.trim().toLowerCase();
  const rows = (S.groups || []).filter((g) => !q || String(g.group_name || "").toLowerCase().includes(q) || String(g.group_id).includes(q));
  box.innerHTML = rows.length ? rows.map((g) =>
    "<div class=\"row\"><div class=\"avatar sm\">" + esc(initial(g.group_name)) + "</div>" +
    "<div class=\"r-main\"><div class=\"r-title\">" + esc(g.group_name || "未命名群") + "</div>" +
    "<div class=\"r-sub\">" + esc(g.group_id) + "</div></div>" +
    "<div class=\"r-right\">" + (g.member_count ? esc(g.member_count) + " 人" : "") + "</div></div>").join("") : emptyState(q ? "没有匹配的群" : "群列表为空", "i-msg");
}
async function loadVersionInfo() {
  if (S.versionInfo || !S.account) return;
  const account = S.account;
  try {
    const body = await callAction("get_version_info");
    if (S.account === account && body.status === "ok") { S.versionInfo = body.data; const el = $("#acVer"); if (el && body.data) el.textContent = body.data.app_version || "—"; }
  } catch (e) {}
}
</script>
<script>
"use strict";
/* ================= 连接 ================= */
const NET_SECTIONS = [
  { kind: "httpServers", title: "HTTP 服务端", desc: "向 OneBot 客户端提供 HTTP API 与 /healthz" },
  { kind: "wsServers", title: "正向 WebSocket 服务端", desc: "OneBot 客户端主动连接本协议端" },
  { kind: "httpClients", title: "HTTP 客户端（事件上报）", desc: "向外部 HTTP 地址推送事件" },
  { kind: "wsClients", title: "反向 WebSocket 客户端", desc: "由本协议端主动连接外部 OneBot 服务" }
];

function renderConnect(root) {
  if (!S.account) { root.innerHTML = "<div class=\"card\"><div class=\"card-b\">" + emptyState("尚未绑定微信账号，无法读取网络配置") + "</div></div>"; return; }
  if (!S.network) {
    root.innerHTML = "<div class=\"card\"><div class=\"card-b\">" + emptyState("读取网络配置…", "i-link") + "</div></div>";
    loadNetwork();
    return;
  }
  const rt = S.runtime || {};
  const accounts = [...new Set([S.account, S.status && S.status.configuredAccount, ...((S.status && S.status.runtimes) || []).map((row) => row.account)].filter(Boolean))];
  const accountOptions = accounts.map((account) => "<option value=\"" + esc(account) + "\"" + (account === S.account ? " selected" : "") + ">" + esc(account) + "</option>").join("");
  const tabs = [{ kind: "general", title: "通用设置" }, ...NET_SECTIONS].map((sec) =>
    "<button class=\"tab " + (S.configTab === sec.kind ? "on" : "") + "\" data-act=\"net-tab\" data-kind=\"" + sec.kind + "\">" + esc(sec.title) + "</button>").join("");
  const sections = NET_SECTIONS.filter((sec) => S.configTab === sec.kind).map((sec) => {
    const rows = (S.network[sec.kind] || []);
    return "<section class=\"section\"><div class=\"section-h\"><div><h2>" + esc(sec.title) + "</h2><p>" + esc(sec.desc) + "</p></div>" +
      "<button class=\"btn sm\" data-act=\"net-add\" data-kind=\"" + sec.kind + "\"><svg class=\"i\"><use href=\"#i-plus\"/></svg>新增</button></div>" +
      "<div class=\"grid cols-2\">" + (rows.length ? rows.map((row, i) => endpointCard(sec.kind, i, row)).join("") : "<div class=\"card\"><div class=\"card-b\">" + emptyState("未配置 " + sec.title, "i-link") + "</div></div>") + "</div></section>";
  }).join("");
  const general = S.configTab === "general" ?
    "<div class=\"grid cols-2\"><div class=\"card\"><div class=\"card-h\"><h2>通用设置</h2></div><div class=\"card-b\"><label class=\"field\"><span>心跳间隔（秒）</span>" +
    "<input class=\"input\" type=\"number\" min=\"0.5\" max=\"300\" step=\"0.5\" id=\"heartbeatInput\" value=\"" + esc(S.network.heartbeatIntervalSeconds ?? 5) + "\"></label>" +
    "<p class=\"small muted\">保存后立即更新网络配置，无需重启账号。</p></div></div>" +
    "<div class=\"card\"><div class=\"card-h\"><h2>当前运行时</h2></div><div class=\"card-b\"><div class=\"kv\">" +
    "<div><div class=\"k\">账号</div><div class=\"v\">" + esc(S.account) + "</div></div><div><div class=\"k\">状态</div><div class=\"v\">" + (rt.online ? "在线" : rt.started ? "离线" : "未启动") + "</div></div>" +
    "<div><div class=\"k\">事件连接</div><div class=\"v\">" + esc((rt.network && rt.network.connections) || 0) + "</div></div><div><div class=\"k\">self_id</div><div class=\"v\">" + esc(rt.self_id || "—") + "</div></div>" +
    "</div></div></div></div>" : "";
  root.innerHTML =
    "<div class=\"note\"><svg class=\"i\"><use href=\"#i-alert\"/></svg><div>网络配置按账号保存在 <span class=\"mono\">data/accounts/&lt;账号&gt;/onebot.json</span>。保存后端点独立生效，微信账号未启动时也可监听和连接。</div></div>" +
    "<div class=\"surface-header\"><div><h2>账号配置</h2><p>按账号分别管理 HTTP 和 WebSocket 连接。</p></div><select id=\"configAccount\" class=\"input\" style=\"width:min(320px,100%)\">" + accountOptions + "</select></div>" +
    "<div class=\"page-tabs\">" + tabs + "</div>" +
    "<div class=\"card\"><div class=\"card-b\"><div class=\"toolbar\">" +
      "<span class=\"small muted\">账号 <b class=\"mono\">" + esc(S.account) + "</b> · 事件连接 <b class=\"mono\">" + esc((rt.network && rt.network.connections) || 0) + "</b></span>" +
      "<div style=\"flex:1\"></div>" +
      "<button class=\"btn ghost sm\" data-act=\"net-json\"><svg class=\"i\"><use href=\"#i-code\"/></svg>原始 JSON</button>" +
      "<button class=\"btn sm\" data-act=\"net-reload\"><svg class=\"i\"><use href=\"#i-refresh\"/></svg>重新读取</button>" +
      "<button class=\"btn primary sm\" data-act=\"net-save\"><svg class=\"i\"><use href=\"#i-check\"/></svg>保存配置</button>" +
    "</div></div></div>" +
    "<div id=\"netRawWrap\" class=\"card" + (S.networkJsonOpen ? "" : " hidden") + "\"><div class=\"card-h\"><h2>原始 JSON</h2><div class=\"spacer\"></div><button class=\"btn sm\" data-act=\"net-json-apply\">应用到表单</button></div>" +
      "<div class=\"card-b\"><textarea class=\"input mono\" id=\"netRaw\" spellcheck=\"false\" style=\"height:300px\"></textarea></div></div>" +
    general + sections;
  if (S.networkJsonOpen) fillRawJson();
  $("#configAccount").addEventListener("change", (event) => selectAccount(event.target.value));
}

function endpointCard(kind, index, row) {
  const isServer = kind === "httpServers" || kind === "wsServers";
  const snap = ((S.runtime && S.runtime.network && S.runtime.network[kind]) || []).find((x) => x.name === row.name);
  const running = !!(snap && snap.started);
  const fields =
    (isServer
      ? field("host", "监听地址", row.host, "text") + field("port", "端口", row.port, "number") +
        field("path", "路径", row.path, "text") + field("accessToken", "Access Token", row.accessToken, "password", true)
      : field("url", "目标地址", row.url, "text", true) + field("accessToken", "Access Token", row.accessToken, "password") +
        (kind === "httpClients" ? field("timeoutSeconds", "超时（秒）", row.timeoutSeconds, "number") : field("reconnectSeconds", "重连间隔（秒）", row.reconnectSeconds, "number")));
  return "<div class=\"card endpoint" + (row.enabled === false ? " off" : "") + "\" data-kind=\"" + kind + "\" data-index=\"" + index + "\">" +
    "<div class=\"ep-h\"><span class=\"dot " + (running && row.enabled !== false ? "ok" : "idle") + "\"></span>" +
      "<input class=\"ghost-input\" data-f=\"name\" value=\"" + esc(row.name) + "\" placeholder=\"名称\">" +
      (row.enabled === false ? "<span class=\"badge\">已禁用</span>" : (running ? "<span class=\"badge ok\">运行中</span>" : "<span class=\"badge\">未启动</span>")) +
      "<button class=\"switch " + (row.enabled !== false ? "on" : "") + "\" data-act=\"net-toggle\" title=\"启用 / 禁用\"></button>" +
      "<button class=\"icon-btn\" data-act=\"net-del\" title=\"删除\"><svg class=\"i\"><use href=\"#i-trash\"/></svg></button></div>" +
    "<div class=\"ep-b\">" + fields + "</div>" +
    "<div class=\"ep-f\"><span>" + esc(kind) + " · #" + (index + 1) + "</span><span>" + (kind === "wsClients" || kind === "httpClients" ? "出站" : "入站") + "</span></div></div>";
}

function field(name, label, value, type, span2 = false) {
  return "<label class=\"field" + (span2 ? " span2" : "") + "\"><span>" + esc(label) + "</span>" +
    "<input class=\"input\" data-f=\"" + name + "\" type=\"" + type + "\" value=\"" + esc(value ?? "") + "\" spellcheck=\"false\" autocomplete=\"off\"></label>";
}

async function loadNetwork() {
  if (!S.account) return;
  const account = S.account;
  try {
    const data = await api("/api/accounts/" + encodeURIComponent(account) + "/network");
    if (S.account !== account) return;
    S.network = data;
    if (S.view === "connect") render();
  } catch (error) {
    const root = $("#view");
    if (S.view === "connect" && root) root.innerHTML = "<div class=\"card\"><div class=\"card-b\">" + emptyState("读取网络配置失败：" + error.message) + "</div></div>";
  }
}

function collectNetwork() {
  const heartbeat = $("#heartbeatInput");
  const out = { heartbeatIntervalSeconds: heartbeat ? Number(heartbeat.value) : (S.network.heartbeatIntervalSeconds ?? 5),
    httpServers: S.network.httpServers || [], httpClients: S.network.httpClients || [], wsServers: S.network.wsServers || [], wsClients: S.network.wsClients || [] };
  if (NET_SECTIONS.some((sec) => sec.kind === S.configTab)) out[S.configTab] = [];
  $$("#view .endpoint").forEach((card) => {
    const kind = card.dataset.kind;
    const val = (name) => { const el = card.querySelector("[data-f=\"" + name + "\"]"); return el ? el.value.trim() : ""; };
    const number = (name) => { const raw = val(name); return raw === "" ? "" : Number(raw); };
    const on = card.querySelector(".switch").classList.contains("on");
    if (kind === "httpServers" || kind === "wsServers") {
      out[kind].push({ name: val("name"), host: val("host"), port: number("port"), path: val("path"), accessToken: val("accessToken"), enabled: on });
    } else if (kind === "httpClients") {
      out[kind].push({ name: val("name"), url: val("url"), accessToken: val("accessToken"), timeoutSeconds: number("timeoutSeconds"), enabled: on });
    } else {
      out[kind].push({ name: val("name"), url: val("url"), accessToken: val("accessToken"), reconnectSeconds: number("reconnectSeconds"), enabled: on });
    }
  });
  return out;
}

function fillRawJson() {
  const area = $("#netRaw"); if (!area) return;
  area.value = JSON.stringify(collectNetwork(), null, 2);
}

async function saveNetwork() {
  if (!S.account) return;
  const payload = collectNetwork();
  try {
    const result = await api("/api/accounts/" + encodeURIComponent(S.account) + "/network", {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
    });
    if (result.saved !== true) { toast(result.message || "保存失败", "bad", 5200); return; }
    toast(result.message || "网络配置已保存", "ok", 4600);
    S.network = payload;
    await refreshStatus();
    if (S.view === "connect") render();
  } catch (error) { toast("保存失败：" + error.message, "bad", 5200); }
}

function defaultEndpoint(kind, count) {
  if (kind === "httpServers") return { name: "http-" + (count + 1), host: "127.0.0.1", port: 6702, path: "/", accessToken: "", enabled: true };
  if (kind === "wsServers") return { name: "ws-" + (count + 1), host: "127.0.0.1", port: 6703, path: "/ws", accessToken: "", enabled: true };
  if (kind === "httpClients") return { name: "http-client-" + (count + 1), url: "http://127.0.0.1:8080/", accessToken: "", timeoutSeconds: 5, enabled: true };
  return { name: "ws-client-" + (count + 1), url: "ws://127.0.0.1:8080/onebot/v11/ws", accessToken: "", reconnectSeconds: 1, enabled: true };
}

function syncConnectStates() {
  if (!S.network || S.view !== "connect") return;
  $$("#view .endpoint").forEach((card) => {
    const kind = card.dataset.kind; const nameInput = card.querySelector("[data-f=\"name\"]");
    const name = nameInput ? nameInput.value.trim() : "";
    const snap = ((S.runtime && S.runtime.network && S.runtime.network[kind]) || []).find((x) => x.name === name);
    const dot = card.querySelector(".ep-h .dot");
    const badge = card.querySelectorAll(".ep-h .badge")[0];
    const running = !!(snap && snap.started);
    if (dot) dot.className = "dot " + (running ? "ok" : "idle");
    if (badge) { badge.className = "badge" + (running ? " ok" : ""); badge.textContent = running ? "运行中" : "未启动"; }
  });
}

function renderEvents(root) {

async function loadRuntimeLogs() {
  try {
    const result = await api("/api/logs");

function filteredRuntimeLogs() {
  const q = S.logQuery.trim().toLowerCase();
  return (S.logs || []).filter((row) => {
    const level = String(row.level || "").toLowerCase();
    return (S.logLevel === "all" || level === S.logLevel) &&
      (!q || String(row.scope || "").toLowerCase().includes(q) || String(row.message || "").toLowerCase().includes(q));
  });
}

function drawRuntimeLogs() {
  const box = $("#runtimeLogList"); if (!box) return;
  const rows = filteredRuntimeLogs();
  const count = $("#logCount"); if (count) count.textContent = rows.length + " / " + (S.logs || []).length;
  box.innerHTML = rows.length ? rows.slice().reverse().map((row) => {
    const level = String(row.level || "info").toLowerCase();
    return "<div class=\"log-line " + (level === "warning" ? "warn" : level === "error" || level === "critical" ? "error" : "") + "\"><span>" + esc(fmtTime(row.time)) + "</span>" +
      "<span class=\"level\">" + esc(level.toUpperCase()) + "</span><span class=\"scope\">" + esc(row.scope || "—") + "</span><span class=\"message\">" + esc(row.message || "") + "</span></div>";
  }).join("") : emptyState(S.logs ? "暂无匹配的运行日志" : "正在读取运行日志…", "i-list");

function exportRuntimeLogs() {
  const rows = filteredRuntimeLogs();
  const content = rows.map((row) => [row.time, row.level, row.scope, row.message].join(" ")).join("\n") + "\n";
  const url = URL.createObjectURL(new Blob([content], { type: "text/plain;charset=utf-8" }));
  const link = document.createElement("a"); link.href = url; link.download = "wechat-onebot-logs.txt"; link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function loadEvents(silent = false) {
  if (!S.account) { const el = $("#evList"); if (el) el.innerHTML = emptyState("账号未就绪"); return; }
  try {
    const body = await api("/api/accounts/" + encodeURIComponent(S.account) + "/events");
    S.events = body.events || [];
    renderEventList();
  } catch (error) {
    if (!silent) { const el = $("#evList"); if (el) el.innerHTML = emptyState("读取事件失败：" + error.message); }
  }
}

function eventMatches(ev, q) {
  if (!q) return true;
  try { return JSON.stringify(ev).toLowerCase().includes(q); } catch (e) { return false; }
}

function renderEventList() {
  const box = $("#evList"); if (!box) return;
  const q = S.eventQuery.trim().toLowerCase();
  const rows = S.events.filter((ev) => (S.eventFilter === "all" || ev.post_type === S.eventFilter) && eventMatches(ev, q));
  const hint = $("#evHint"); if (hint) hint.textContent = rows.length + " / " + S.events.length;
  const count = $("#evCount"); if (count) count.textContent = "共 " + S.events.length + " 条";
  box.innerHTML = rows.length ? rows.map((ev) => {
    const idx = S.events.indexOf(ev);
    const sel = S.selectedEvent === idx ? " sel" : "";
    const meta = ev.post_type === "message" ? ((ev.message_type || "") + " · " + (ev.user_id || (ev.sender && ev.sender.user_id) || "")) : (ev.sub_type || ev.notice_type || ev.request_type || "");
    return "<div class=\"event-row" + sel + "\" data-act=\"ev-row\" data-idx=\"" + idx + "\">" +
      "<span class=\"event-time\">" + esc(fmtTime(ev.time)) + "</span>" +
      "<span class=\"badge " + badgeClass(ev.post_type) + "\">" + esc(ev.post_type || "event") + "</span>" +
      "<span class=\"event-title\">" + esc(summarize(ev)) + "</span>" +
      "<span class=\"event-meta\">" + esc(meta) + "</span></div>";
  }).join("") : emptyState("没有匹配的事件");
  if (S.selectedEvent !== null) renderEventDetail();
}

function renderEventDetail() {
  const box = $("#evDetail"); if (!box) return;
  const ev = S.events[S.selectedEvent];
  if (!ev) { box.innerHTML = emptyState("选择左侧事件查看完整 JSON", "i-code"); return; }
  box.innerHTML = "<div class=\"toolbar\" style=\"margin-bottom:10px\">" +
      "<span class=\"badge " + badgeClass(ev.post_type) + "\">" + esc(ev.post_type || "event") + "</span>" +
      "<span class=\"badge\">" + esc(fmtDateTime(ev.time)) + "</span>" +
      "<span class=\"badge\">self_id " + esc(ev.self_id || "—") + "</span></div>" +
    "<pre class=\"code\" style=\"max-height:calc(100vh - 380px)\">" + esc(JSON.stringify(ev, null, 2)) + "</pre>";
}

<script>
"use strict";
/* ================= 调试 ================= */
function isReadOnly(def) { return !!(def && (def.read_only || /^(get_|can_)/.test(def.name || ""))); }

const ACTION_GROUPS = [
  { name: "消息发送", test: (n) => n.startsWith("send_") },
  { name: "消息记录", test: (n) => n.includes("msg") && !n.startsWith("send_") },
  { name: "群聊", test: (n) => n.startsWith("get_group") },
  { name: "好友", test: (n) => n.startsWith("get_friend") },
  { name: "能力探测", test: (n) => n.startsWith("can_") },
  { name: "系统与账号", test: () => true }
];

function renderDebug(root) {
  const tabs = [["tester", "动作测试"], ["compose", "消息编排"], ["activity", "实时活动"], ["api", "接口目录"]];
  root.innerHTML = "<div class=\"page-tabs\">" + tabs.map(([key, label]) =>
    "<button class=\"tab " + (S.debugTab === key ? "on" : "") + "\" data-act=\"debug-tab\" data-tab=\"" + key + "\">" + label + "</button>").join("") +
    "</div><div id=\"debugBody\"></div>";
  const body = $("#debugBody");
  if (S.debugTab === "tester") renderActionTester(body);
  else if (S.debugTab === "compose") renderComposer(body);
  else if (S.debugTab === "activity") renderEventActivity(body);
  else renderApiBrowser(body);
}

function renderActionTester(root) {
  if (!S.catalog) {
    root.innerHTML = "<div class=\"card\"><div class=\"card-b\">" + emptyState(S.catalogError || (S.account ? "正在读取动作目录…" : "账号未就绪，无法读取动作目录"), "i-flask") +
      (S.catalogError ? "<div style=\"text-align:center\"><button class=\"btn sm\" data-act=\"dbg-reload\">重试</button></div>" : "") + "</div></div>";
    if (S.account && !S.catalogLoading && !S.catalogError) loadCaps();
    return;
  }
  root.innerHTML =
    "<div class=\"debug\">" +
      "<div class=\"card\"><div class=\"card-b\" style=\"padding:10px\"><div class=\"search\" style=\"max-width:none\">" +
        "<svg class=\"i\"><use href=\"#i-search\"/></svg><input class=\"input\" id=\"dbgQuery\" placeholder=\"搜索动作\" value=\"" + esc(S.actionQuery) + "\"></div></div>" +
        "<div class=\"act-list\" id=\"actList\"></div></div>" +

  $("#dbgQuery").addEventListener("input", (event) => { S.actionQuery = event.target.value; renderActionList(); });

}

function renderComposer(root) {
  root.innerHTML =
    "<div class=\"grid two\"><div class=\"card\"><div class=\"card-h\"><h2>OneBot 消息编排</h2></div><div class=\"card-b\" style=\"display:grid;gap:13px\">" +
    "<div class=\"grid cols-2\"><label class=\"field\"><span>消息类型</span><select id=\"composeType\" class=\"input\"><option value=\"private\">私聊</option><option value=\"group\">群聊</option></select></label>" +
    "<label class=\"field\"><span>OneBot 目标 ID</span><input id=\"composeTarget\" class=\"input mono\" inputmode=\"numeric\" placeholder=\"user_id 或 group_id\" value=\"" + esc(S.composeTarget) + "\"></label></div>" +
    "<label class=\"field\"><span>消息内容</span><textarea id=\"composeMessage\" class=\"input\" style=\"height:150px\" placeholder=\"文本，或 OneBot 消息段 JSON 数组\">" + esc(S.composeMessage) + "</textarea></label>" +
    "<label class=\"check\"><input id=\"composeConfirm\" type=\"checkbox\">我确认向真实微信联系人或群发送该消息</label>" +
    "<div class=\"toolbar\"><span class=\"small muted\">通过 WebUI 动作接口调用标准 OneBot 发送动作</span><div style=\"flex:1\"></div><button class=\"btn primary\" data-act=\"compose-send\">发送消息</button></div>" +
    "</div></div><div class=\"card\"><div class=\"card-h\"><h2>发送回包</h2></div><div class=\"card-b\"><pre class=\"code\" id=\"composeResult\">" + esc(S.composeResult ? JSON.stringify(S.composeResult, null, 2) : "尚未发送") + "</pre></div></div></div>";
  $("#composeType").value = S.composeType;
  $("#composeType").addEventListener("change", (event) => { S.composeType = event.target.value; });
  $("#composeTarget").addEventListener("input", (event) => { S.composeTarget = event.target.value; });
  $("#composeMessage").addEventListener("input", (event) => { S.composeMessage = event.target.value; });
}

async function sendComposedMessage() {
  const target = Number(S.composeTarget.trim());
  if (!Number.isSafeInteger(target) || target <= 0) throw new Error("目标 ID 必须是正整数");
  if (!S.composeMessage.trim()) throw new Error("请输入消息内容");
  if (!$("#composeConfirm").checked) throw new Error("发送前请勾选确认");
  let message = S.composeMessage;
  if (message.trim().startsWith("[") || message.trim().startsWith("{")) {
    try { message = JSON.parse(message); } catch (error) { throw new Error("消息段 JSON 无效：" + error.message); }
  }
  const action = S.composeType === "group" ? "send_group_msg" : "send_private_msg";
  const params = S.composeType === "group" ? { group_id: target, message } : { user_id: target, message };
  S.composeResult = await callAction(action, params);
  const box = $("#composeResult"); if (box) box.textContent = JSON.stringify(S.composeResult, null, 2);
  toast(S.composeResult.status === "ok" ? "消息已发送" : "发送失败：" + (S.composeResult.message || S.composeResult.retcode), S.composeResult.status === "ok" ? "ok" : "bad");
}

function renderApiBrowser(root) {
  if (!S.catalog) {
    root.innerHTML = "<div class=\"card\"><div class=\"card-b\">" + emptyState(S.catalogError || "正在读取动作目录…", "i-code") +
      (S.catalogError ? "<div style=\"text-align:center\"><button class=\"btn sm\" data-act=\"dbg-reload\">重试</button></div>" : "") + "</div></div>";
    if (S.account && !S.catalogLoading && !S.catalogError) loadCaps(); return;
  }
  const q = S.apiQuery.trim().toLowerCase();
  const rows = S.catalog.filter((row) => row.name.toLowerCase().includes(q) || String(row.summary || "").toLowerCase().includes(q));
  root.innerHTML = "<div class=\"card\"><div class=\"card-b\"><div class=\"toolbar\"><div class=\"search\"><svg class=\"i\"><use href=\"#i-search\"/></svg>" +
    "<input id=\"apiQuery\" class=\"input\" placeholder=\"搜索 OneBot 动作\" value=\"" + esc(S.apiQuery) + "\"></div><span class=\"small muted\">" + rows.length + " / " + S.catalog.length + " 个动作</span></div></div></div>" +
    "<div class=\"grid cols-2\">" + rows.map((row) => "<div class=\"card\"><div class=\"card-h\"><h2 class=\"mono\">" + esc(row.name) + "</h2><div class=\"spacer\"></div>" +
    "<span class=\"badge " + (isReadOnly(row) ? "ok" : "warn") + "\">" + (isReadOnly(row) ? "只读" : "写操作") + "</span></div><div class=\"card-b\">" +
    "<p class=\"small dim\">" + esc(row.summary || "") + "</p><div class=\"chips\">" + Object.entries(row.params || {}).map(([name, spec]) =>
      "<span class=\"chip\">" + esc(name) + (spec.required ? " *" : "") + "</span>").join("") + "</div><div style=\"margin-top:12px\"><button class=\"btn sm\" data-act=\"api-try\" data-name=\"" + esc(row.name) + "\">试一下</button></div></div></div>").join("") + "</div>";
  $("#apiQuery").addEventListener("input", (event) => { S.apiQuery = event.target.value; renderApiBrowser(root); $("#apiQuery").focus(); });
}

function renderActionList() {
  const box = $("#actList"); if (!box) return;
  const q = S.actionQuery.trim().toLowerCase();
  const items = (S.catalog || []).filter((a) => !q || a.name.includes(q) || (a.summary || "").toLowerCase().includes(q));
  const groups = ACTION_GROUPS.map((g) => ({ name: g.name, rows: [] }));
  items.forEach((a) => { const g = ACTION_GROUPS.find((x) => x.test(a.name)) || ACTION_GROUPS[ACTION_GROUPS.length - 1]; groups.find((x) => x.name === g.name).rows.push(a); });
  box.innerHTML = groups.filter((g) => g.rows.length).map((g) =>
    "<div class=\"act-group\">" + esc(g.name) + "</div>" + g.rows.map((a) =>
      "<div class=\"act-item" + (S.action === a.name ? " sel" : "") + "\" data-act=\"dbg-select\" data-name=\"" + esc(a.name) + "\">" +
      "<span class=\"dot " + (isReadOnly(a) ? "ok" : "warn") + "\"></span>" +
      "<span class=\"a-name\">" + esc(a.name) + "</span></div>").join("")).join("") || emptyState("没有匹配的动作");
}

function renderDebugPanel() {
  const box = $("#dbgPanel"); if (!box) return;
  const def = (S.catalog || []).find((a) => a.name === S.action);
  if (!def) {
    box.innerHTML = "<div class=\"card\"><div class=\"card-b\">" + emptyState("从左侧选择一个动作开始调试", "i-flask") + "</div></div>";
    return;
  }
  const paramNames = Object.keys(def.params || {});
  let form;
  if (S.actionJsonMode) {
    form = "<textarea class=\"input mono\" id=\"dbgJson\" spellcheck=\"false\" style=\"height:150px\">" + esc(JSON.stringify(S.actionParams || {}, null, 2)) + "</textarea>";
  } else if (!paramNames.length) {
    form = "<div class=\"note\"><svg class=\"i\"><use href=\"#i-code\"/></svg><div>该动作不需要参数，直接发送即可。</div></div>";
  } else {
    form = "<div class=\"grid cols-2\">" + paramNames.map((name) => {
      const spec = def.params[name] || {};
      const value = S.actionParams ? S.actionParams[name] : undefined;
      const label = "<span>" + esc(name) + (spec.required ? "<span class=\"req\">*</span>" : "") + "</span>";
      if (spec.kind === "bool") {
        return "<label class=\"field\">" + label + "<select class=\"input\" data-param=\"" + esc(name) + "\" data-kind=\"bool\">" +
          "<option value=\"\">默认</option><option value=\"true\"" + (value === true ? " selected" : "") + ">true</option><option value=\"false\"" + (value === false ? " selected" : "") + ">false</option></select></label>";
      }
      if (name === "message") {
        const text = value === undefined ? "" : (typeof value === "string" ? value : JSON.stringify(value, null, 2));
        return "<label class=\"field span2\" style=\"grid-column:span 2\">" + label + "<textarea class=\"input\" data-param=\"message\" data-kind=\"str\" style=\"height:96px\" placeholder=\"文本，或消息段 JSON 数组\">" + esc(text) + "</textarea></label>";
      }
      return "<label class=\"field\">" + label + "<input class=\"input\" data-param=\"" + esc(name) + "\" data-kind=\"" + esc(spec.kind || "str") + "\" value=\"" + esc(value ?? "") + "\" placeholder=\"" + esc(spec.description || "") + "\" spellcheck=\"false\"></label>";
    }).join("") + "</div>";
  }
  const confirm = isReadOnly(def) ? "" :
    "<label class=\"check\" style=\"margin-top:12px\"><input type=\"checkbox\" id=\"confirmWrite\"" + (S.confirmWrite ? " checked" : "") + ">我确认这是一次写操作（会真实发送或修改微信数据）</label>";
  const result = S.actionResult;
  const resp = result
    ? "<div class=\"resp-h\"><span class=\"badge " + (result.status === "ok" ? "ok" : "bad") + "\">" + esc(result.status === "ok" ? "成功" : "失败") + "</span>" +
      "<span>retcode " + esc(result.retcode ?? "—") + "</span><span>" + esc(result._elapsed ?? 0) + " ms</span>" +
      "<span>" + esc(fmtBytes(new Blob([JSON.stringify(result)]).size)) + "</span><div style=\"flex:1\"></div>" +
      "<button class=\"btn ghost sm\" data-act=\"dbg-copy\">复制</button></div>" +
      "<div class=\"resp-b\"><pre class=\"code\" style=\"max-height:360px\">" + esc(JSON.stringify(result, null, 2)) + "</pre></div>"
    : "<div class=\"resp-h\"><span class=\"badge\">WAITING</span><span>尚未执行</span></div><div class=\"resp-b\"><pre class=\"code muted\" style=\"max-height:120px\">" + esc("// 发送后在此显示 OneBot v11 响应\n{\n  \"status\": \"ok\",\n  \"retcode\": 0,\n  \"data\": {}\n}") + "</pre></div>";
  box.innerHTML =
    "<div class=\"card\"><div class=\"card-h\"><h2 class=\"mono\" style=\"color:var(--accent)\">" + esc(def.name) + "</h2>" +
      "<span class=\"badge " + (isReadOnly(def) ? "ok" : "warn") + "\">" + (isReadOnly(def) ? "只读" : "写操作") + "</span>" +
      "<span class=\"hint\">" + esc(def.summary || "") + "</span><div class=\"spacer\"></div>" +
      "<button class=\"btn ghost sm\" data-act=\"dbg-example\">填充示例</button>" +
      "<button class=\"btn ghost sm\" data-act=\"dbg-json\">" + (S.actionJsonMode ? "表单模式" : "原始 JSON") + "</button>" +
      "<button class=\"btn primary sm\" data-act=\"dbg-run\"" + (S.actionBusy ? " disabled" : "") + "><svg class=\"i\"><use href=\"#i-send\"/></svg>" + (S.actionBusy ? "发送中…" : "发送") + "</button></div>" +
      "<div class=\"card-b\"><div id=\"dbgParams\">" + form + "</div>" + confirm + "</div></div>" +
    "<div class=\"card\">" + resp + "</div>";
  const cw = $("#confirmWrite");
  if (cw) cw.addEventListener("change", (event) => { S.confirmWrite = event.target.checked; });
}

function collectActionParams() {
  if (S.actionJsonMode) {
    const raw = $("#dbgJson") ? $("#dbgJson").value.trim() : "{}";
    const parsed = JSON.parse(raw || "{}");
    if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) throw new Error("参数必须是 JSON 对象");
    return parsed;
  }
  const params = {};
  $$("#dbgParams [data-param]").forEach((el) => {
    const name = el.dataset.param; const kind = el.dataset.kind; const raw = el.value.trim();
    if (raw === "") return;
    if (kind === "bool") { params[name] = raw === "true"; return; }
    if (kind === "int" || kind === "signed_int32") {
      const num = Number(raw); if (!Number.isFinite(num)) throw new Error(name + " 必须是数字"); params[name] = num; return;
    }
    if (name === "message" && (raw.startsWith("[") || raw.startsWith("{"))) {
      try { params[name] = JSON.parse(raw); return; } catch (e) { throw new Error("message 看起来是 JSON，但解析失败"); }
    }
    params[name] = raw;
  });
  return params;
}

async function runDebugAction() {
  const def = (S.catalog || []).find((a) => a.name === S.action); if (!def) return;
  let params;
  try { params = collectActionParams(); } catch (error) { toast(error.message, "bad"); return; }
  if (!isReadOnly(def) && !S.confirmWrite) { toast("写操作需要先勾选确认", "bad", 3200); return; }
  S.actionBusy = true; S.actionParams = params; renderDebugPanel();
  try {
    const body = await callAction(def.name, params);
    S.actionResult = body;
    toast(body.status === "ok" ? "动作执行成功" : ("动作执行失败：" + (body.message || ("retcode " + body.retcode))), body.status === "ok" ? "ok" : "bad", 3000);
  } catch (error) {
    S.actionResult = { status: "failed", retcode: -1, message: error.message, data: null };
    toast("调用失败：" + error.message, "bad", 4200);
  } finally { S.actionBusy = false; if (S.view === "debug") renderDebugPanel(); }
}
