document.getElementById("view").addEventListener("click", async (event) => {
  const el = event.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  try {
    if (act === "sort-toggle") {
      const control = el.closest(".sort-control");
      const open = control.classList.toggle("open");
      $(".sort-menu", control).classList.toggle("hidden", !open);
      el.setAttribute("aria-expanded", String(open));
      if (open) $(".sort-option[aria-selected='true']", control).focus();
      return;
    }
    if (act === "sort-select") {
      S.processSort = el.dataset.sort;
      const control = el.closest(".sort-control");
      $(".sort-trigger", control).firstChild.textContent = el.textContent;
      control.classList.remove("open");
      $(".sort-menu", control).classList.add("hidden");
      $(".sort-trigger", control).setAttribute("aria-expanded", "false");
      $$(".sort-option", control).forEach((option) => option.setAttribute("aria-selected", String(option === el)));
      $(".sort-trigger", control).focus();
      drawProcesses(); return;
    }
    if (act === "goto") { setView(el.dataset.view); return; }
    if (act === "goto-http-clients") { S.configTab = "httpClients"; setView("connect"); return; }
    if (act === "goto-debug-api") { S.debugTab = "api"; setView("debug"); return; }
    if (act === "settings-tab") { S.settingsTab = el.dataset.tab; render(); return; }
    if (act === "theme-select") {
      const dark = el.dataset.theme === "dark";
      document.documentElement.classList.toggle("dark", dark);
      localStorage.setItem("wechat-onebot-theme", dark ? "dark" : "light");
      render(); return;
    }
    if (act === "sidebar-toggle") { $("#railPin").click(); render(); return; }
    if (act === "log-tab") { S.logTab = el.dataset.tab; render(); return; }
    if (act === "log-refresh") { await loadRuntimeLogs(); return; }
    if (act === "log-export") { exportRuntimeLogs(); return; }
    if (act === "debug-tab") { S.debugTab = el.dataset.tab; render(); return; }
    if (act === "compose-send") { el.disabled = true; try { await sendComposedMessage(); } finally { el.disabled = false; } return; }
    if (act === "api-try") {
      const def = (S.catalog || []).find((row) => row.name === el.dataset.name); if (!def) return;
      S.action = def.name; S.actionParams = JSON.parse(JSON.stringify((def.examples && def.examples[0]) || {}));
      S.actionJsonMode = false; S.actionResult = null; S.confirmWrite = false; S.debugTab = "tester"; render(); return;
    }
    if (act === "acct-start" || act === "acct-stop" || act === "acct-restart") {
      if (!S.account || S.bridgeBusy) return;
      const base = "/api/accounts/" + encodeURIComponent(S.account);
      if (act === "acct-stop" && !confirm("停止微信账号桥接？OneBot 端点将继续运行。")) return;
      if (act === "acct-restart" && !confirm("重启微信账号桥接？OneBot 端点将继续运行。")) return;
      S.bridgeBusy = true;
      const restore = busyButton(el, act === "acct-stop" ? "停止中…" : act === "acct-start" ? "启动中…" : "重启中…");
      const peers = ["acct-start", "acct-restart", "acct-stop"].map((name) => $("[data-act='" + name + "']")).filter((button) => button && button !== el);
      peers.forEach((button) => { button.disabled = true; });
      try {
        if (act === "acct-stop") { await api(base + "/stop", { method: "POST" }); toast("微信桥接已停止，OneBot 端点保持运行", "ok"); }
        else if (act === "acct-start") { await startRuntime(base); toast("微信桥接已启动", "ok"); }
        else { await api(base + "/stop", { method: "POST" }); await new Promise((r) => setTimeout(r, 800)); await startRuntime(base); toast("微信桥接已重启", "ok"); }
        await refreshStatus(); ensureRuntimeData(); await loadProcesses(false);
      } finally { S.bridgeBusy = false; restore(); syncAccount(); }
      return;
    }
    if (act === "acct-friends") { el.disabled = true; await loadFriends(); toast("好友列表已更新", "ok"); el.disabled = false; return; }
    if (act === "acct-groups") { el.disabled = true; await loadGroups(); toast("群列表已更新", "ok"); el.disabled = false; return; }
    if (act === "proc-refresh" || act === "proc-scan") {
      const restore = busyButton(el, act === "proc-scan" ? "扫描中…" : "刷新中…");
      const feedback = $("#procFeedback"); if (feedback) feedback.textContent = act === "proc-scan" ? "正在扫描已登录账号…" : "正在刷新实例状态…";
      try {
        const ok = await loadProcesses(act === "proc-scan");
        const message = ok ? (act === "proc-scan" ? "账号扫描已完成" : "实例状态已刷新") : (S.processError || "读取失败");
        if (feedback) feedback.textContent = message;
        toast(message, ok ? "ok" : "bad");
      } finally { restore(); }
      return;
    }
    if (act === "proc-select") { selectAccount(el.dataset.account); return; }
    if (act === "proc-bind") {
      const account = el.dataset.account;
      if (!confirm("将 " + account + " 设为机器人账号？这一步只保存绑定，不启动原生桥接。")) return;
      const restore = busyButton(el, "绑定中…");
      try {
        await api("/api/account-selection", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ account }) });
        selectAccount(account, true);
        S.processes = null;
        await refreshStatus();
        await loadProcesses(true);
        render();
        toast("已设为机器人账号；当前桥接状态已更新", "ok", 4200);
      } finally { restore(); }
      return;
    }
    if (act === "net-tab") { S.network = collectNetwork(); S.configTab = el.dataset.kind; render(); return; }
    if (act === "net-add") {
      S.network = collectNetwork();

      S.network[kind].splice(index, 1); render(); return;
    }
    if (act === "net-toggle") {
      const card = el.closest(".endpoint");
      const on = el.classList.toggle("on");
      card.classList.toggle("off", !on);
      const badge = card.querySelector(".ep-h .badge");
      if (badge) { badge.className = "badge"; badge.textContent = on ? "未启动" : "已禁用"; }
      return;
    }
    if (act === "net-save") { await saveNetwork(); return; }
    if (act === "net-reload") { S.network = null; S.networkJsonOpen = false; render(); return; }
    if (act === "net-json") {
      S.network = collectNetwork();
      S.networkJsonOpen = !S.networkJsonOpen; render();
      return;
    }
    if (act === "net-json-apply") {
      try {
        const parsed = JSON.parse($("#netRaw").value || "{}");
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed) ||
            NET_SECTIONS.some(({ kind }) => parsed[kind] !== undefined &&
              (!Array.isArray(parsed[kind]) || parsed[kind].some((row) => !row || typeof row !== "object" || Array.isArray(row))))) {
          throw new Error("网络配置必须是 JSON 对象，通道必须是对象数组");
        }
        S.network = parsed; S.networkJsonOpen = false; render(); toast("JSON 已应用到表单，尚未保存", "ok");
      } catch (error) { toast("JSON 无效：" + error.message, "bad"); }
      return;
    }
    if (act === "ev-refresh") { await loadEvents(); toast("事件已刷新", "ok", 1500); return; }
    if (act === "ev-row") {
      $$("#evList .event-row").forEach((r) => r.classList.toggle("sel", r === el));
      S.selectedEvent = Number(el.dataset.idx); renderEventDetail(); return;
    }
    if (act === "ev-copy") {
      const ev = S.events[S.selectedEvent]; if (!ev) { toast("请先选择事件", "bad"); return; }
      await copyText(JSON.stringify(ev, null, 2)); return;
    }
    if (act === "dbg-select") {
      const name = el.dataset.name; const def = (S.catalog || []).find((a) => a.name === name); if (!def) return;
      S.action = name; S.actionResult = null; S.actionJsonMode = false; S.confirmWrite = false;
      const example = (def.examples && def.examples[0]) || {};
      S.actionParams = JSON.parse(JSON.stringify(example));
      $$("#actList .act-item").forEach((r) => r.classList.toggle("sel", r === el));
      renderDebugPanel(); return;
    }
    if (act === "dbg-run") { await runDebugAction(); return; }
    if (act === "dbg-example") {
      const def = (S.catalog || []).find((a) => a.name === S.action); if (!def) return;
      const example = (def.examples && def.examples[0]) || {};
      S.actionParams = JSON.parse(JSON.stringify(example)); S.actionJsonMode = false; renderDebugPanel();
      toast("已填充示例参数", "ok", 1600); return;
    }
    if (act === "dbg-json") {
      try { S.actionParams = collectActionParams(); }
      catch (error) { toast(error.message, "bad"); return; }
      S.actionJsonMode = !S.actionJsonMode; renderDebugPanel(); return;
    }
    if (act === "dbg-copy") { if (S.actionResult) await copyText(JSON.stringify(S.actionResult, null, 2)); return; }
    if (act === "dbg-reload") { S.catalog = null; S.catalogError = ""; render(); return; }
    if (act === "sto-refresh") { S.storage = null; render(); return; }
    if (act === "sto-copy") { await copyText(el.dataset.path || ""); return; }
    if (act === "change-password") {
      const currentPassword = $("#currentPassword").value;
      const newPassword = $("#changedPassword").value;
      if (newPassword.length < 8) { toast("新密码至少需要 8 个字符", "bad"); return; }
      if (newPassword !== $("#confirmChangedPassword").value) { toast("两次输入的新密码不一致", "bad"); return; }
      el.disabled = true;
      await api("/api/change-password", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ currentPassword, newPassword }) });
      $("#currentPassword").value = ""; $("#changedPassword").value = ""; $("#confirmChangedPassword").value = "";
      el.disabled = false;
      toast("管理密码已更新", "ok"); return;
    }
    if (act === "set-logout") { $("#btnLogout").click(); return; }
  } catch (error) {
    toast(error.message || String(error), "bad", 5200);
    el.disabled = false;
  }
});
document.addEventListener("click", (event) => {
  const control = $("#procSort");
  if (!control || control.contains(event.target)) return;
  control.classList.remove("open");
  $(".sort-menu", control).classList.add("hidden");
  $(".sort-trigger", control).setAttribute("aria-expanded", "false");
});
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  const control = $("#procSort");
  if (!control || !control.classList.contains("open")) return;
  control.classList.remove("open");
  $(".sort-menu", control).classList.add("hidden");
  $(".sort-trigger", control).setAttribute("aria-expanded", "false");
  $(".sort-trigger", control).focus();
});

function ensureRuntimeData() {
  S.friends = null; S.groups = null; S.storage = null; S.caps = null; S.catalog = null; S.catalogError = "";
  S.loginInfo = null; S.versionInfo = null; S.processes = null;
  S.events = []; S.selectedEvent = null; S.network = null;
  if (S.view === "overview" || S.view === "account" || S.view === "connect") render();
}

/* ================= 启动 ================= */
let polling = false;
function startPolling() {
  if (polling) return; polling = true;
  let busy = false;
  setInterval(async () => {
    if (document.hidden || busy) return;
    busy = true;
    try {
      if (S.view === "overview") await loadOverviewEvents();
      if (S.view === "events" && S.logTab === "runtime" && S.logAuto) await loadRuntimeLogs();
      if (((S.view === "events" && S.logTab === "events") || (S.view === "debug" && S.debugTab === "activity")) && S.eventsAuto) await loadEvents(true);
      if (S.view === "connect" && S.network) syncConnectStates();
    } finally { busy = false; }
  }, 5000);
}

async function boot() {
  try {
    applyStatus(await api("/api/status"));
    enterApp();
    startPolling();
    loadLoginInfo();
    loadCaps();
  } catch (error) {
    showLogin();
    if (error.status !== 401) $("#loginErr").textContent = "无法连接 WebUI 服务：" + error.message;
  }
}
boot();
</script>
