[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-onebot"
version = "0.11.5"
description = "OneBot v11 gateway for a personal Windows WeChat account using the helper or wechatbot_api native bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "websockets>=13,<16",
  "pefile==2023.2.7",
  "cryptography>=49,<50",
  "Pillow>=13,<14",
  "imageio-ffmpeg>=0.6,<0.7",
  "silk-python==0.2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
wechat-onebot = "wechat_onebot.cli:main"

[project.urls]
Repository = "https://github.com/PorkLittleHamburger/wechatbot"
Issues = "https://github.com/PorkLittleHamburger/wechatbot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
